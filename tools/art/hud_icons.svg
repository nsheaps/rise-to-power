<svg xmlns="http://www.w3.org/2000/svg" width="384" height="96" viewBox="0 0 384 96">
  <!-- HUD resource icons, 96px each, left to right: food, wood, gold, stone. -->
  <defs>
    <radialGradient id="apple" cx="0.35" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#ff8a70"/>
      <stop offset="0.5" stop-color="#d8382c"/>
      <stop offset="1" stop-color="#6e1410"/>
    </radialGradient>
    <linearGradient id="leaf" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9ad64a"/>
      <stop offset="1" stop-color="#3c7a1c"/>
    </linearGradient>
    <linearGradient id="log" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a86c3a"/>
      <stop offset="1" stop-color="#5a3416"/>
    </linearGradient>
    <radialGradient id="logEnd" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f0cf96"/>
      <stop offset="0.7" stop-color="#d4a86a"/>
      <stop offset="1" stop-color="#8a5a2a"/>
    </radialGradient>
    <linearGradient id="coin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff0a8"/>
      <stop offset="0.5" stop-color="#f0c040"/>
      <stop offset="1" stop-color="#a87010"/>
    </linearGradient>
    <linearGradient id="coinEdge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c08a20"/>
      <stop offset="1" stop-color="#7a5008"/>
    </linearGradient>
    <linearGradient id="rock" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d8d8d4"/>
      <stop offset="0.5" stop-color="#9a9a98"/>
      <stop offset="1" stop-color="#4a4a4c"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="1.5" flood-color="#000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Food: apple with a leaf -->
  <g filter="url(#sh)">
    <path d="M48,30 C36,18 14,24 14,50 C14,70 30,86 42,84 C46,83 50,83 54,84 C66,86 82,70 82,50 C82,24 60,18 48,30 Z" fill="url(#apple)"/>
    <path d="M48,30 C46,24 44,18 46,10" stroke="#5a3214" stroke-width="4" fill="none" stroke-linecap="round"/>
    <path d="M48,24 C52,10 68,8 74,14 C70,26 56,30 48,24 Z" fill="url(#leaf)"/>
    <ellipse cx="34" cy="40" rx="8" ry="12" fill="#fff" opacity="0.28" transform="rotate(-20 34 40)"/>
  </g>

  <!-- Wood: stacked logs -->
  <g transform="translate(96,0)" filter="url(#sh)">
    <rect x="12" y="48" width="56" height="26" rx="4" fill="url(#log)"/>
    <ellipse cx="68" cy="61" rx="12" ry="13" fill="url(#logEnd)" stroke="#5a3416" stroke-width="2"/>
    <circle cx="68" cy="61" r="6" fill="none" stroke="#a87a48" stroke-width="1.5"/>
    <rect x="26" y="22" width="56" height="26" rx="4" fill="url(#log)"/>
    <ellipse cx="26" cy="35" rx="12" ry="13" fill="url(#logEnd)" stroke="#5a3416" stroke-width="2"/>
    <circle cx="26" cy="35" r="6" fill="none" stroke="#a87a48" stroke-width="1.5"/>
    <path d="M40,26 L76,26 M40,32 L74,32" stroke="#c48a52" stroke-width="2" opacity="0.5"/>
    <path d="M18,52 L54,52 M18,58 L52,58" stroke="#c48a52" stroke-width="2" opacity="0.5"/>
  </g>

  <!-- Gold: coin stack -->
  <g transform="translate(192,0)" filter="url(#sh)">
    <ellipse cx="42" cy="74" rx="30" ry="10" fill="url(#coinEdge)"/>
    <rect x="12" y="62" width="60" height="12" fill="url(#coinEdge)"/>
    <ellipse cx="42" cy="62" rx="30" ry="10" fill="url(#coin)"/>
    <rect x="12" y="50" width="60" height="12" fill="url(#coinEdge)"/>
    <ellipse cx="42" cy="50" rx="30" ry="10" fill="url(#coin)"/>
    <ellipse cx="54" cy="36" rx="30" ry="10" fill="url(#coinEdge)" transform="rotate(-12 54 36)"/>
    <rect x="24" y="26" width="60" height="10" fill="url(#coinEdge)" transform="rotate(-12 54 36)"/>
    <ellipse cx="54" cy="26" rx="30" ry="10" fill="url(#coin)" transform="rotate(-12 54 36)"/>
    <ellipse cx="54" cy="26" rx="20" ry="6" fill="none" stroke="#c08a20" stroke-width="1.5" transform="rotate(-12 54 36)"/>
    <ellipse cx="42" cy="18" rx="10" ry="3" fill="#fff" opacity="0.5" transform="rotate(-12 54 36)"/>
  </g>

  <!-- Stone: a chiselled rock -->
  <g transform="translate(288,0)" filter="url(#sh)">
    <path d="M18,66 L26,34 L50,16 L78,30 L84,58 L66,80 L30,82 Z" fill="url(#rock)" stroke="#2a2a2c" stroke-width="2" stroke-linejoin="round"/>
    <path d="M26,34 L50,40 L78,30 M50,40 L46,82 M50,40 L84,58" stroke="#3a3a3c" stroke-width="2" fill="none" opacity="0.7"/>
    <path d="M30,38 L48,22 L72,32" stroke="#fff" stroke-width="2" fill="none" opacity="0.45"/>
    <path d="M50,42 L54,80" stroke="#fff" stroke-width="1.5" fill="none" opacity="0.25"/>
  </g>
</svg>
