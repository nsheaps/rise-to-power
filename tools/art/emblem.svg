<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!-- Title emblem: a gold laurel wreath around a shield bearing a citadel tower and rising sun. -->
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff0b8"/>
      <stop offset="0.35" stop-color="#e9c25c"/>
      <stop offset="0.6" stop-color="#c08a2a"/>
      <stop offset="1" stop-color="#8a5e18"/>
    </linearGradient>
    <linearGradient id="goldH" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a87a28"/>
      <stop offset="0.5" stop-color="#ffe59a"/>
      <stop offset="1" stop-color="#a87a28"/>
    </linearGradient>
    <linearGradient id="shield" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5d2a2a"/>
      <stop offset="0.55" stop-color="#3b1818"/>
      <stop offset="1" stop-color="#1e0c0c"/>
    </linearGradient>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b2a52"/>
      <stop offset="0.7" stop-color="#b9683e"/>
      <stop offset="1" stop-color="#f3c27a"/>
    </linearGradient>
    <linearGradient id="tower" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e8d2b0"/>
      <stop offset="0.5" stop-color="#b8956c"/>
      <stop offset="1" stop-color="#5a4030"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff6d0"/>
      <stop offset="0.5" stop-color="#ffd978"/>
      <stop offset="1" stop-color="#ffd978" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000" flood-opacity="0.6"/>
    </filter>
    <filter id="emboss" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="1" flood-color="#000" flood-opacity="0.5"/>
    </filter>
    <clipPath id="shieldClip">
      <path d="M256,96 C300,118 340,122 372,118 L372,250 C372,330 320,392 256,428 C192,392 140,330 140,250 L140,118 C172,122 212,118 256,96 Z"/>
    </clipPath>
  </defs>

  <g filter="url(#shadow)">
    <!-- Laurel wreath -->
    <g fill="url(#gold)" stroke="#6a4610" stroke-width="1.5">
      <!-- left branch -->
      <g transform="translate(256,256)">
        <g id="leafL">
          <path d="M-168,70 q-30,-22 -22,-58 q30,18 22,58 Z"/>
        </g>
        <path d="M-180,30 q-28,-26 -14,-60 q26,22 14,60 Z"/>
        <path d="M-182,-14 q-20,-30 -2,-62 q20,28 2,62 Z"/>
        <path d="M-172,-58 q-10,-34 14,-60 q12,32 -14,60 Z"/>
        <path d="M-152,-98 q0,-36 30,-54 q4,34 -30,54 Z"/>
        <path d="M-122,-130 q10,-34 44,-46 q-4,34 -44,46 Z"/>
        <path d="M-84,-154 q18,-30 54,-34 q-12,32 -54,34 Z"/>
        <path d="M-148,100 q-34,-14 -34,-52 q34,10 34,52 Z"/>
        <path d="M-122,126 q-36,-6 -46,-42 q36,2 46,42 Z"/>
        <!-- right branch mirrored -->
        <g transform="scale(-1,1)">
          <path d="M-168,70 q-30,-22 -22,-58 q30,18 22,58 Z"/>
          <path d="M-180,30 q-28,-26 -14,-60 q26,22 14,60 Z"/>
          <path d="M-182,-14 q-20,-30 -2,-62 q20,28 2,62 Z"/>
          <path d="M-172,-58 q-10,-34 14,-60 q12,32 -14,60 Z"/>
          <path d="M-152,-98 q0,-36 30,-54 q4,34 -30,54 Z"/>
          <path d="M-122,-130 q10,-34 44,-46 q-4,34 -44,46 Z"/>
          <path d="M-84,-154 q18,-30 54,-34 q-12,32 -54,34 Z"/>
          <path d="M-148,100 q-34,-14 -34,-52 q34,10 34,52 Z"/>
          <path d="M-122,126 q-36,-6 -46,-42 q36,2 46,42 Z"/>
        </g>
      </g>
    </g>
    <!-- Wreath stems -->
    <path d="M100,380 C84,300 86,200 128,120 M412,380 C428,300 426,200 384,120" stroke="url(#gold)" stroke-width="7" fill="none" stroke-linecap="round"/>
    <!-- Ribbon knot at the bottom -->
    <path d="M226,392 L256,372 L286,392 L256,414 Z" fill="url(#gold)" stroke="#6a4610" stroke-width="1.5"/>
    <path d="M226,392 L200,432 L224,430 L236,452 L256,414 Z" fill="url(#gold)" stroke="#6a4610" stroke-width="1.5"/>
    <path d="M286,392 L312,432 L288,430 L276,452 L256,414 Z" fill="url(#gold)" stroke="#6a4610" stroke-width="1.5"/>

    <!-- Shield -->
    <path d="M256,86 C304,110 346,114 382,108 L382,250 C382,336 326,402 256,440 C186,402 130,336 130,250 L130,108 C166,114 208,110 256,86 Z" fill="url(#gold)"/>
    <path d="M256,96 C300,118 340,122 372,118 L372,250 C372,330 320,392 256,428 C192,392 140,330 140,250 L140,118 C172,122 212,118 256,96 Z" fill="url(#shield)"/>
    <g clip-path="url(#shieldClip)">
      <!-- sunrise behind the tower -->
      <rect x="140" y="96" width="232" height="190" fill="url(#sky)"/>
      <circle cx="256" cy="282" r="120" fill="url(#sun)" opacity="0.9"/>
      <circle cx="256" cy="282" r="34" fill="#fff3c4"/>
      <g stroke="#ffe29a" stroke-width="5" opacity="0.8" stroke-linecap="round">
        <path d="M256,230 L256,196"/><path d="M296,246 L320,222"/><path d="M216,246 L192,222"/>
        <path d="M312,282 L346,282"/><path d="M200,282 L166,282"/><path d="M330,254 L360,242"/><path d="M182,254 L152,242"/>
      </g>
      <!-- ground -->
      <path d="M140,286 C190,272 230,276 256,282 C290,290 330,278 372,290 L372,440 L140,440 Z" fill="#2c4a2c"/>
      <path d="M140,300 C200,290 240,300 372,296 L372,440 L140,440 Z" fill="#1c301c"/>
      <!-- tower -->
      <rect x="226" y="170" width="60" height="150" fill="url(#tower)"/>
      <rect x="220" y="160" width="72" height="14" fill="#8a6a48"/>
      <g fill="#c9a680"><rect x="220" y="150" width="14" height="12"/><rect x="249" y="150" width="14" height="12"/><rect x="278" y="150" width="14" height="12"/></g>
      <rect x="238" y="186" width="10" height="18" fill="#2a1a10"/><rect x="264" y="186" width="10" height="18" fill="#2a1a10"/>
      <rect x="238" y="226" width="10" height="18" fill="#2a1a10"/><rect x="264" y="226" width="10" height="18" fill="#2a1a10"/>
      <path d="M244,320 L244,290 A12,12 0 0 1 268,290 L268,320 Z" fill="#1a1008"/>
      <!-- flanking walls -->
      <rect x="150" y="248" width="80" height="60" fill="#6a5440"/>
      <rect x="150" y="240" width="80" height="10" fill="#8a6a48"/>
      <rect x="282" y="248" width="80" height="60" fill="#4a3a2c"/>
      <rect x="282" y="240" width="80" height="10" fill="#6a5438"/>
      <!-- banner -->
      <rect x="254" y="100" width="4" height="52" fill="#3a2a1a"/>
      <path d="M258,104 L296,116 L258,130 Z" fill="#d9412f"/>
    </g>
    <!-- Shield bevel highlight -->
    <path d="M256,96 C300,118 340,122 372,118 L372,250 C372,330 320,392 256,428 C192,392 140,330 140,250 L140,118 C172,122 212,118 256,96 Z" fill="none" stroke="#ffe8a8" stroke-width="2" opacity="0.5"/>
  </g>
</svg>
