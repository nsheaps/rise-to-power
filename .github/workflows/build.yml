name: Build

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history and tags for versioning

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Compute version
        id: version
        run: |
          # Semantic version from the latest vX.Y.Z tag, bumped by the commits since it:
          # "BREAKING CHANGE" or "type!:" -> major, "feat" -> minor, anything else -> patch.
          last=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n1)
          if [ -z "$last" ]; then
            next="1.0.0"
          else
            IFS=. read -r major minor patch <<< "${last#v}"
            log=$(git log --format='%s%n%b' "$last..HEAD")
            if grep -qE '^BREAKING CHANGE|^[a-z]+(\(.+\))?!:' <<< "$log"; then
              major=$((major + 1)); minor=0; patch=0
            elif grep -qE '^feat(\(.+\))?:' <<< "$log"; then
              minor=$((minor + 1)); patch=0
            else
              patch=$((patch + 1))
            fi
            next="$major.$minor.$patch"
          fi
          code=$(git rev-list --count HEAD)
          echo "name=$next" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "Version $next (code $code), previous tag: ${last:-none}"

      - name: Decode release keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "RELEASE_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::RELEASE_KEYSTORE_BASE64 is not set; the release APK is signed with a throwaway debug key."
          fi

      - name: Test
        run: ./gradlew test --stacktrace

      - name: Build APKs
        env:
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: >-
          ./gradlew assembleDebug assembleRelease --stacktrace
          -PversionName=${{ steps.version.outputs.name }}
          -PversionCode=${{ steps.version.outputs.code }}

      - name: Collect APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/rise-to-power-${{ steps.version.outputs.name }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: rise-to-power-apk
          path: |
            dist/*.apk
            app/build/outputs/apk/debug/*.apk

      - name: Publish GitHub release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v${{ steps.version.outputs.name }}"
          gh release create "$tag" dist/*.apk \
            --target "$GITHUB_SHA" \
            --title "Rise to Power $tag" \
            --generate-notes
